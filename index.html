<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מה ללבוש</title>
<meta name="description" content="מזג האוויר ומה ללבוש בבוקר, בצהריים ובערב">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מה ללבוש">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* iOS-style grouped layout: system font, inset cards, hairline separators, system colors. */
:root {
  --bg: #F2F2F7; --card: #FFFFFF; --label: #000000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.18); --fill: rgba(118,118,128,.12); --seg-on: #FFFFFF; --accent: #007AFF;
  --blue: #007AFF; --orange: #FF9500; --yellow: #FFCC00; --indigo: #5856D6; --teal: #30B0C7; --red: #FF3B30; --green: #34C759;
  --cloud: #AEAEB2;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Hebrew", system-ui, "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000000; --card: #1C1C1E; --label: #FFFFFF; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
          --sep: rgba(84,84,88,.6); --fill: rgba(118,118,128,.24); --seg-on: #636366; --accent: #0A84FF;
          --blue: #0A84FF; --orange: #FF9F0A; --yellow: #FFD60A; --indigo: #5E5CE6; --teal: #40C8E0; --cloud: #8E8E93; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--label); font-family: var(--font); font-size: 17px; line-height: 1.3;
  letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.wrap { max-width: 480px; margin: 0 auto; }
button, select { font: inherit; color: inherit; }
svg.i { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; overflow: visible; }

/* nav bar: location picker at the top-left */
.nav { display: flex; justify-content: flex-end; height: 44px; align-items: center; }
.loc { position: relative; display: inline-flex; align-items: center; gap: 5px; color: var(--accent); font-size: 17px; }
.loc svg { width: 15px; height: 15px; }
.loc select { position: absolute; inset: 0; opacity: 0; width: 100%; font-size: 16px; }

/* hero */
.hero { text-align: center; padding: 6px 0 22px; }
.hero .city { font-size: 30px; font-weight: 400; letter-spacing: 0; }
.hero .temp { font-size: 96px; font-weight: 200; line-height: 1; margin: 2px 0 0; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; padding-left: .2em; }
.hero .cond { font-size: 20px; font-weight: 500; color: var(--label2); }
.hero .hl { font-size: 17px; font-weight: 500; margin-top: 2px; font-variant-numeric: tabular-nums; }
.hero .sum { font-size: 15px; color: var(--label2); margin-top: 10px; }

/* grouped sections */
.sec { margin-top: 26px; }
.sec-h { display: flex; justify-content: space-between; align-items: center; padding: 0 16px 7px; font-size: 13px; color: var(--label2); text-transform: none; }
.card { background: var(--card); border-radius: 14px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 9px 16px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 0; right: 58px; height: .5px; background: var(--sep); }
.row.plain + .row.plain::before { right: 16px; }
.badge { flex: 0 0 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: #fff; }
.badge svg { width: 18px; height: 18px; }
.row .main { flex: 1; min-width: 0; }
.row .t1 { font-size: 17px; }
.row .t2 { font-size: 13px; color: var(--label2); margin-top: 1px; }
.row .val { font-size: 17px; color: var(--label2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.past { opacity: .4; }

/* segmented control */
.seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 4px 14px; font-size: 13px; font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--seg-on); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); }
.wide-seg { display: flex; }
.wide-seg button { flex: 1; }

/* hourly */
.hours { display: flex; overflow-x: auto; padding: 12px 6px 14px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.hours::-webkit-scrollbar { display: none; }
.hour { flex: 0 0 54px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 15px; font-variant-numeric: tabular-nums; }
.hour .h { font-size: 13px; color: var(--label2); font-weight: 500; }
.hour .ic { height: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.hour .ic svg { width: 24px; height: 24px; }
.hour .p { font-size: 11px; color: var(--blue); font-weight: 600; line-height: 1; }
.hour .tt { font-weight: 500; }

/* week */
.day { display: grid; grid-template-columns: 58px 34px 36px 1fr 36px; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; position: relative; font-variant-numeric: tabular-nums; }
.day + .day::before { content: ""; position: absolute; top: 0; left: 16px; right: 16px; height: .5px; background: var(--sep); }
.day .dn { font-weight: 500; }
.day .ic { display: flex; flex-direction: column; align-items: center; }
.day .ic svg { width: 24px; height: 24px; }
.day .ic small { font-size: 11px; color: var(--blue); font-weight: 600; line-height: 1; }
.day .lo { color: var(--label2); text-align: center; }
.day .hi { text-align: center; }
.track { height: 5px; border-radius: 3px; background: var(--fill); position: relative; }
.track span { position: absolute; top: 0; bottom: 0; border-radius: 3px; }

.msg { text-align: center; color: var(--label2); padding: 80px 20px; }
.msg button { margin-top: 14px; border: 0; background: var(--fill); color: var(--accent); border-radius: 10px; padding: 8px 18px; }
.foot { text-align: center; font-size: 12px; color: var(--label3); margin-top: 22px; }
.foot a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <label class="loc" id="locBtn">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M14.6 1.4c.3.3.4.7.2 1.1l-5.3 11.9c-.4.9-1.7.8-1.9-.2L6.6 9.4 1.8 8.4c-1-.2-1.1-1.5-.2-1.9L13.5 1.2c.4-.2.8-.1 1.1.2z"/></svg>
      <span id="locName">מיקום</span>
      <svg viewBox="0 0 16 16" aria-hidden="true" style="width:11px;height:11px"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3.5 6l4.5 4.5L12.5 6"/></svg>
      <select id="city" aria-label="בחירת מיקום"></select>
    </label>
  </div>

  <div id="app"><div class="msg">טוען…</div></div>

  <div class="sec">
    <div class="sec-h"><span>התאמה אישית</span></div>
    <div class="card">
      <div class="row plain">
        <div class="main"><div class="t1">בדרך כלל לי</div></div>
        <div class="seg" id="bias" role="group" aria-label="רגישות לקור">
          <button data-v="-3">קר מהר</button><button data-v="0">רגיל</button><button data-v="3">חם מהר</button>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">נתונים: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · <span id="updated"></span></div>
</div>

<script>
const CITIES = [ // Tel Aviv first (the fallback), the rest alphabetical
  ["תל אביב", 32.0853, 34.7818], ["אילת", 29.5577, 34.9519], ["אריאל", 32.1046, 35.1745], ["אשדוד", 31.8014, 34.6435],
  ["אשקלון", 31.6688, 34.5743], ["באר שבע", 31.252, 34.7915], ["בית שמש", 31.747, 34.9881], ["בני ברק", 32.0807, 34.8338],
  ["בת ים", 32.0171, 34.7454], ["גבעתיים", 32.0722, 34.8125], ["דימונה", 31.07, 35.033], ["הוד השרון", 32.15, 34.888],
  ["הרצליה", 32.1624, 34.8447], ["זכרון יעקב", 32.5707, 34.952], ["חדרה", 32.434, 34.9196], ["חולון", 32.0158, 34.7874],
  ["חיפה", 32.794, 34.9896], ["טבריה", 32.7959, 35.531], ["יבנה", 31.878, 34.739], ["יקנעם", 32.6593, 35.1059],
  ["ירושלים", 31.7683, 35.2137], ["כפר סבא", 32.1782, 34.9076], ["כרמיאל", 32.919, 35.295], ["לוד", 31.951, 34.8881],
  ["מודיעין", 31.8969, 35.0095], ["מעלה אדומים", 31.777, 35.298], ["מצפה רמון", 30.61, 34.801], ["נהריה", 33.0059, 35.0941],
  ["נס ציונה", 31.9293, 34.7987], ["נצרת", 32.6996, 35.3035], ["נתניה", 32.3215, 34.8532], ["עכו", 32.9281, 35.0818],
  ["עפולה", 32.6078, 35.2897], ["ערד", 31.2588, 35.2128], ["פתח תקווה", 32.0871, 34.8875], ["צפת", 32.9646, 35.496],
  ["קריית גת", 31.61, 34.7642], ["קריית שמונה", 33.2073, 35.5697], ["ראש העין", 32.0956, 34.9566], ["ראשון לציון", 31.973, 34.7925],
  ["רחובות", 31.8928, 34.8113], ["רמלה", 31.9279, 34.8625], ["רמת גן", 32.0684, 34.8248], ["רעננה", 32.1848, 34.8713],
  ["שדרות", 31.525, 34.5961]
];
const HERE = "here";

// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const r = (x) => { const v = Math.round(x); return Object.is(v, -0) ? 0 : v; };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const svg = (inner, cls = "i") => { const t = document.createElement("template"); t.innerHTML = `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${inner}</svg>`; return t.content.firstChild; };
function nearest(lat, lon) {
  let best = null, bd = Infinity;
  CITIES.forEach(([n, a, b]) => { const dd = (a - lat) ** 2 + ((b - lon) * Math.cos(lat * Math.PI / 180)) ** 2; if (dd < bd) { bd = dd; best = n; } });
  return bd < 0.04 ? best : "המיקום שלי"; // within ~20 km
}

// ---------- weather glyphs (drawn, not emoji) ----------
const G = {
  sun: '<circle cx="12" cy="12" r="4.6" fill="var(--yellow)"/><g stroke="var(--yellow)" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g>',
  moon: '<path fill="var(--label2)" d="M14.5 3.2a8.8 8.8 0 1 0 6.3 12.1A7.3 7.3 0 0 1 14.5 3.2z"/>',
  cloud: (y = 0, c = "var(--cloud)") => `<path fill="${c}" transform="translate(0 ${y})" d="M7 19.5h10.2a4.3 4.3 0 0 0 .6-8.56A6 6 0 0 0 6.3 10.2 4.66 4.66 0 0 0 7 19.5z"/>`,
  smallSun: '<g transform="translate(-3.2 -4) scale(.75)"><circle cx="12" cy="12" r="4.6" fill="var(--yellow)"/><g stroke="var(--yellow)" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v1.8M3 12h1.8M5.6 5.6l1.3 1.3M18.4 5.6l-1.3 1.3"/></g></g>',
  smallMoon: '<path fill="var(--label2)" transform="translate(-2.4 -3.4) scale(.7)" d="M14.5 3.2a8.8 8.8 0 1 0 6.3 12.1A7.3 7.3 0 0 1 14.5 3.2z"/>',
  drops: '<g stroke="var(--blue)" stroke-width="1.9" stroke-linecap="round"><path d="M8.5 18.5l-1 2.6M12.5 18.5l-1 2.6M16.5 18.5l-1 2.6"/></g>',
  drizzle: '<g fill="var(--blue)"><circle cx="8.6" cy="20.3" r="1"/><circle cx="12.6" cy="20.3" r="1"/><circle cx="16.6" cy="20.3" r="1"/></g>',
  bolt: '<path fill="var(--yellow)" d="M12.8 15.5h-2.6l-1.4 4h2.2l-1 3.6 4.4-5.1h-2.4l.8-2.5z"/>',
  snow: '<g fill="var(--teal)"><circle cx="8.6" cy="20.6" r="1.1"/><circle cx="12.6" cy="21.4" r="1.1"/><circle cx="16.6" cy="20.6" r="1.1"/></g>',
  fog: '<g stroke="var(--cloud)" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M3 13h18M5 17h14"/></g>'
};
function glyph(code, isDay = 1) {
  const up = (s) => G.cloud(-3) + s;
  if (code === 0 || code === 1) return isDay ? G.sun : G.moon;
  if (code === 2) return (isDay ? G.smallSun : G.smallMoon) + G.cloud(0.5);
  if (code === 3) return G.cloud(-1);
  if (code === 45 || code === 48) return G.fog;
  if (code >= 51 && code <= 57) return up(G.drizzle);
  if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return up(G.drops);
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return up(G.snow);
  if (code >= 95) return up(G.bolt);
  return G.cloud(-1);
}
function skyText(code) {
  if (code === 0) return "בהיר";
  if (code === 1) return "בהיר ברובו";
  if (code === 2) return "מעונן חלקית";
  if (code === 3) return "מעונן";
  if (code === 45 || code === 48) return "ערפל";
  if (code >= 51 && code <= 57) return "טפטוף";
  if (code >= 61 && code <= 67) return "גשם";
  if (code >= 71 && code <= 77) return "שלג";
  if (code >= 80 && code <= 82) return "ממטרים";
  if (code >= 85 && code <= 86) return "ממטרי שלג";
  if (code >= 95) return "סופת רעמים";
  return "";
}
// Settings-style badge icons
const B = {
  morning: ['var(--orange)', '<path fill="#fff" d="M12 9.2a5 5 0 0 1 5 5H7a5 5 0 0 1 5-5z"/><g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 3.5v2.3M5.4 7.6l1.5 1.5M18.6 7.6l-1.5 1.5M3.5 17.5h17"/></g>'],
  noon: ['var(--yellow)', '<circle cx="12" cy="12" r="4.4" fill="#fff"/><g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/></g>'],
  evening: ['var(--indigo)', '<path fill="#fff" d="M14.2 4a8.2 8.2 0 1 0 5.9 11.3A6.8 6.8 0 0 1 14.2 4z"/>'],
  umbrella: ['var(--blue)', '<path fill="#fff" d="M12 3.5a8.5 8.5 0 0 1 8.5 8.3H3.5A8.5 8.5 0 0 1 12 3.5z"/><path fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" d="M12 11.5v6.2a2 2 0 0 1-4 0"/>'],
  uv: ['var(--orange)', '<circle cx="12" cy="12" r="4.4" fill="#fff"/><g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/></g>'],
  wind: ['var(--teal)', '<g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3.5 9h11a2.6 2.6 0 1 0-2.6-2.6M3.5 13h14a2.8 2.8 0 1 1-2.8 2.8M3.5 17h7"/></g>'],
  water: ['var(--blue)', '<path fill="#fff" d="M12 3.5s6 6.4 6 10.6a6 6 0 0 1-12 0c0-4.2 6-10.6 6-10.6z"/>']
};
const badge = (k) => { const b = el("div", "badge"); b.style.background = B[k][0]; b.append(svg(B[k][1])); return b; };

// ---------- clothing ----------
// Personal bias: "I get cold fast" shifts every reading down 3°, "I get hot fast" up.
let bias = +(store.get("bias") ?? 0);
const adj = (t) => t + bias;
// General categories only, by feels-like temperature (tuned for Israelis: 20° in the morning is not short-sleeve weather)
const LEVELS = [
  { max: 11, text: "ארוך ומעיל חם" },
  { max: 16, text: "ארוך וג'קט" },
  { max: 20, text: "ארוך וסווטשרט" },
  { max: 23, text: "ארוך דק" },
  { max: 27, text: "קצר" },
  { max: 99, text: "קצר וקליל" }
];
const level = (t) => LEVELS.findIndex((l) => adj(t) < l.max);
function feelWord(t) {
  t = adj(t);
  return t < 10 ? "קר מאוד" : t < 16 ? "קר" : t < 20 ? "קריר" : t < 26 ? "נעים" : t < 30 ? "חם" : "חם מאוד";
}
function tempColor(t) {
  t = adj(t);
  return t < 10 ? "#5AC8FA" : t < 16 ? "#64D2FF" : t < 20 ? "#34C759" : t < 26 ? "#A6D608" : t < 30 ? "#FFCC00" : "#FF9500";
}
// Morning and evening go by the coldest reading in the window (air or feels-like, whichever is lower),
// noon by the average feels-like. Better to carry a layer than to be cold at 8am.
const WEAR_PARTS = [
  ["בוקר", "morning", 6, 10, "cold"],
  ["צהריים", "noon", 11, 16, "avg"],
  ["ערב", "evening", 17, 22, "cold"]
];
function partTemp(data, date, from, to, mode) {
  const H = data.hourly, vals = [];
  for (let h = from; h <= to; h++) {
    const k = H.time.indexOf(date + "T" + String(h).padStart(2, "0") + ":00");
    if (k < 0) continue;
    const a = H.apparent_temperature[k], t = H.temperature_2m[k];
    if (a == null || t == null) continue;
    vals.push(mode === "cold" ? Math.min(a, t) : a);
  }
  if (!vals.length) return null;
  return mode === "cold" ? Math.min(...vals) : vals.reduce((s, v) => s + v, 0) / vals.length;
}

// ---------- time ----------
function localDate(tz) { return new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); }
function localHour(tz) { return +new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "2-digit", hourCycle: "h23" }).format(new Date()); }

// ---------- data ----------
async function load(lat, lon, tz) {
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
    "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day" +
    "&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code,wind_speed_10m,is_day" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,wind_speed_10m_max,sunrise,sunset" +
    "&timezone=" + encodeURIComponent(tz) + "&forecast_days=8";
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}
function getPosition() {
  return new Promise((ok, fail) => {
    if (!navigator.geolocation) return fail(new Error("אין גישה למיקום"));
    navigator.geolocation.getCurrentPosition(
      (p) => ok([+p.coords.latitude.toFixed(3), +p.coords.longitude.toFixed(3)]),
      (e) => fail(new Error(e.code === 1 ? "לא ניתנה הרשאה למיקום" : "לא הצלחתי למצוא את המיקום")),
      { timeout: 10000, maximumAge: 30 * 60 * 1000 }
    );
  });
}

// ---------- render ----------
let state = { data: null, tab: 0, stale: false, place: "" };

function section(title, extra) {
  const s = el("div", "sec"), h = el("div", "sec-h");
  h.append(el("span", null, title)); if (extra) h.append(extra);
  const c = el("div", "card"); s.append(h, c); return [s, c];
}
function row(badgeKey, t1, t2, val, cls) {
  const rw = el("div", "row" + (cls ? " " + cls : ""));
  if (badgeKey) rw.append(badge(badgeKey));
  const m = el("div", "main"); m.append(el("div", "t1", t1)); if (t2) m.append(el("div", "t2", t2));
  rw.append(m); if (val != null) rw.append(el("div", "val", val));
  return rw;
}

function render() {
  const data = state.data, app = $("#app");
  const tz = data.timezone, H = data.hourly, d = data.daily;
  const today = d.time.indexOf(localDate(tz));
  if (today < 0) throw new Error("הנתונים השמורים ישנים מדי");
  app.textContent = "";

  // Now: from "current", or this hour of the hourly forecast when showing old saved data
  let c = data.current;
  if (state.stale) {
    const k = H.time.indexOf(localDate(tz) + "T" + String(localHour(tz)).padStart(2, "0") + ":00");
    if (k >= 0) c = { temperature_2m: H.temperature_2m[k], apparent_temperature: H.apparent_temperature[k], weather_code: H.weather_code[k], wind_speed_10m: H.wind_speed_10m[k], is_day: H.is_day[k] };
  }
  const hero = el("div", "hero");
  hero.append(el("div", "city", state.place), el("div", "temp", r(c.temperature_2m) + "°"), el("div", "cond", skyText(c.weather_code)),
              el("div", "hl", `מקס׳ ${r(d.temperature_2m_max[today])}°  מינ׳ ${r(d.temperature_2m_min[today])}°`));
  const extra = [`מרגיש כמו ${r(c.apparent_temperature)}°`, `רוח ${r(c.wind_speed_10m)} קמ״ש`];
  if (c.relative_humidity_2m != null) extra.push(`לחות ${r(c.relative_humidity_2m)}%`);
  hero.append(el("div", "sum", extra.join("  ·  ")));
  app.append(hero);

  // What to wear: morning / noon / evening, for today or tomorrow
  const seg = el("div", "seg");
  ["היום", "מחר"].forEach((n, i) => { const b = el("button", null, n); b.setAttribute("aria-pressed", state.tab === i); b.onclick = () => { state.tab = i; render(); }; seg.append(b); });
  const [wearSec, wear] = section("מה ללבוש", seg);
  const di = today + state.tab, date = d.time[di];
  const isToday = state.tab === 0, hourNow = localHour(tz);
  WEAR_PARTS.forEach(([name, key, from, to, mode]) => {
    const t = partTemp(data, date, from, to, mode);
    if (t == null) return;
    const L = LEVELS[level(t)];
    wear.append(row(key, L.text, `${name} · ${feelWord(t)}`, r(t) + "°", isToday && hourNow > to ? "past" : ""));
  });
  // Extra notes for the day
  const rain = d.precipitation_probability_max[di] ?? 0, uv = d.uv_index_max[di] ?? 0, wind = d.wind_speed_10m_max[di] ?? 0;
  const noonT = partTemp(data, date, 11, 16, "avg") ?? 0;
  if (rain >= 30) wear.append(row("umbrella", rain >= 60 ? "לקחת מטרייה" : "כדאי מטרייה קטנה בתיק", `סיכוי לגשם ${rain}%`));
  if (uv >= 6) wear.append(row("uv", "קרם הגנה וכובע", `קרינה חזקה, UV ${r(uv)}`));
  else if (uv >= 3 && adj(noonT) >= 23) wear.append(row("uv", "קרם הגנה אם תהיו בחוץ", `קרינה בינונית, UV ${r(uv)}`));
  if (wind >= 30) wear.append(row("wind", "משהו שעוצר רוח", `רוח עד ${r(wind)} קמ״ש`));
  if (adj(noonT) >= 30) wear.append(row("water", "לשתות הרבה מים", "חם מאוד בצהריים"));
  app.append(wearSec);

  // Hourly, starting at the current hour
  const [hourSec, hourCard] = section(`תחזית שעתית · זריחה ${d.sunrise[today].slice(11, 16)} · שקיעה ${d.sunset[today].slice(11, 16)}`);
  const strip = el("div", "hours");
  const nowKey = localDate(tz) + "T" + String(localHour(tz)).padStart(2, "0");
  let start = H.time.findIndex((t) => t.slice(0, 13) >= nowKey); if (start < 0) start = 0;
  for (let k = start; k < Math.min(start + 24, H.time.length); k++) {
    const hr = el("div", "hour"), ic = el("div", "ic");
    ic.append(svg(glyph(H.weather_code[k], H.is_day[k])));
    const p = H.precipitation_probability[k] ?? 0;
    if (p >= 20) ic.append(el("div", "p", p + "%"));
    hr.append(el("div", "h", k === start ? "עכשיו" : H.time[k].slice(11, 13)), ic, el("div", "tt", r(H.temperature_2m[k]) + "°"));
    strip.append(hr);
  }
  hourCard.append(strip);
  app.append(hourSec);

  // 7 days from today
  const [weekSec, week] = section("7 ימים");
  const idxs = []; for (let i = today; i < Math.min(today + 7, d.time.length); i++) idxs.push(i);
  const lo = Math.min(...idxs.map((i) => d.temperature_2m_min[i])), hi = Math.max(...idxs.map((i) => d.temperature_2m_max[i])), span = hi - lo || 1;
  const dayName = new Intl.DateTimeFormat("he-IL", { weekday: "short", timeZone: "UTC" });
  idxs.forEach((i, n) => {
    const rw = el("div", "day");
    const name = n === 0 ? "היום" : dayName.format(new Date(d.time[i] + "T12:00:00Z")).replace("יום ", "");
    const ic = el("div", "ic"); ic.append(svg(glyph(d.weather_code[i])));
    const p = d.precipitation_probability_max[i] ?? 0; if (p >= 30) ic.append(el("small", null, p + "%"));
    const tr = el("div", "track"), bar = el("span");
    bar.style.right = ((d.temperature_2m_min[i] - lo) / span) * 100 + "%";
    bar.style.width = Math.max(6, ((d.temperature_2m_max[i] - d.temperature_2m_min[i]) / span) * 100) + "%";
    bar.style.background = `linear-gradient(to left, ${tempColor(d.temperature_2m_min[i])}, ${tempColor(d.temperature_2m_max[i])})`;
    tr.append(bar);
    rw.append(el("div", "dn", name), ic, el("div", "lo", r(d.temperature_2m_min[i]) + "°"), tr, el("div", "hi", r(d.temperature_2m_max[i]) + "°"));
    week.append(rw);
  });
  app.append(weekSec);
}

function showError(err, kind) {
  const app = $("#app"); app.textContent = "";
  const box = el("div", "msg", kind === "render" ? "משהו השתבש בהצגת מזג האוויר." : "לא הצלחתי לטעון את מזג האוויר. בדקו שיש חיבור לאינטרנט.");
  const det = el("div", null, err && err.message ? err.message : String(err)); det.style.cssText = "font-size:12px;margin-top:8px;opacity:.7";
  const b = el("button", null, "נסו שוב"); b.onclick = refresh;
  box.append(det, el("br"), b); app.append(box);
}

// ---------- start ----------
const sel = $("#city");
sel.add(new Option("המיקום שלי", HERE));
CITIES.forEach((c, i) => sel.add(new Option(c[0], i)));
const savedCity = store.get("city");
sel.value = savedCity == null ? HERE : String(savedCity);
if (sel.selectedIndex < 0) sel.value = HERE;
sel.onchange = () => { store.set("city", sel.value); state.tab = 0; state.data = null; refresh(); };

function paintBias() { document.querySelectorAll("#bias button").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.v === bias)); }
document.querySelectorAll("#bias button").forEach((b) => b.onclick = () => { bias = +b.dataset.v; store.set("bias", bias); paintBias(); if (state.data) render(); });
paintBias();

let lastLoad = 0, busy = false;
async function refresh() {
  if (busy) return; busy = true;
  try {
    let key, lat, lon, tz, place;
    if (sel.value === HERE) {
      key = HERE; tz = "auto";
      const prev = store.get("here");
      try { [lat, lon] = await getPosition(); store.set("here", [lat, lon]); }
      catch (e) {
        if (prev) [lat, lon] = prev;
        else { sel.value = "0"; busy = false; return refresh(); } // no permission: show Tel Aviv
      }
      place = nearest(lat, lon);
    } else {
      const c = CITIES[+sel.value] || CITIES[0];
      [place, lat, lon] = c; key = place; tz = "Asia/Jerusalem";
    }
    state.place = place;
    $("#locName").textContent = sel.value === HERE ? "המיקום שלי" : place;
    const cached = store.get("wx:" + key);
    if (cached && !state.data) {
      state.data = cached.data; state.stale = true;
      try { render(); } catch { state.data = null; }
    }
    let data;
    try { data = await load(lat, lon, tz); }
    catch (e) {
      if (!state.data) showError(e, "load");
      else $("#updated").textContent = "אין חיבור · נתונים מ-" + new Date(cached.at).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
      return;
    }
    try {
      state.data = data; state.stale = false; lastLoad = Date.now();
      store.set("wx:" + key, { data, at: lastLoad });
      render();
      $("#updated").textContent = "עודכן " + new Date().toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
    } catch (e) { console.error(e); showError(e, "render"); }
  } finally { busy = false; }
}
refresh();
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastLoad > 10 * 60 * 1000) refresh(); });
setInterval(() => { if (!document.hidden) refresh(); }, 30 * 60 * 1000);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
